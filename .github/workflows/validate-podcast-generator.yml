name: Validate podcast generator

on:
  push:
    paths:
      - .github/workflows/generate-podcast-draft.yml
      - .github/workflows/validate-podcast-generator.yml
      - scripts/podcast/**
      - podcasts/README.md
  pull_request:
    paths:
      - .github/workflows/generate-podcast-draft.yml
      - .github/workflows/validate-podcast-generator.yml
      - scripts/podcast/**
      - podcasts/README.md

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LOCKOUT_API_URL: https://script.google.com/macros/s/AKfycbxwKK71BSc8n4qxxyZVMGrHa7ycBYCG7qddBPeGgbysb_io5PANaP_HVZ2hppewjbiM-A/exec

    steps:
      - name: Check out the proposed generator
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: node --check scripts/podcast/generate-draft.mjs

      - name: Select the latest completed published week
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const episodes = JSON.parse(fs.readFileSync('podcasts/episodes.json', 'utf8')); const end = episodes.map(item => String(item.date || '')).filter(value => /^\\d{4}-\\d{2}-\\d{2}$/.test(value)).sort().at(-1); if (!end) throw new Error('No dated podcast episode exists.'); const start = new Date(end + 'T12:00:00Z'); start.setUTCDate(start.getUTCDate() - 6); fs.appendFileSync(process.env.GITHUB_ENV, 'PODCAST_START_DATE=' + start.toISOString().slice(0, 10) + '\\nPODCAST_END_DATE=' + end + '\\n');"

      - name: Verify a completed source pack against public live data
        run: node scripts/podcast/generate-draft.mjs --prepare-only
