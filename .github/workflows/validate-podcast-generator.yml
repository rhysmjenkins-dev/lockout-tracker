name: Validate podcast generator

on:
  pull_request:
    paths:
      - .github/workflows/generate-podcast-draft.yml
      - .github/workflows/validate-podcast-generator.yml
      - scripts/podcast/**
      - podcasts/README.md

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LOCKOUT_API_URL: https://script.google.com/macros/s/AKfycbxwKK71BSc8n4qxxyZVMGrHa7ycBYCG7qddBPeGgbysb_io5PANaP_HVZ2hppewjbiM-A/exec

    steps:
      - name: Check out the proposed generator
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check scripts/podcast/generate-draft.mjs

      - name: Verify the next source pack against public live data
        run: node scripts/podcast/generate-draft.mjs --prepare-only
