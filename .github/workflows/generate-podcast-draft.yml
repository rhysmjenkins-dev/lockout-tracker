name: Generate podcast draft

on:
  push:
    branches:
      - agent/podcast-automation-test
    paths:
      - .github/workflows/generate-podcast-draft.yml
      - scripts/podcast/**
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional start date (YYYY-MM-DD); blank uses the next unpublished week
        required: false
        type: string
      end_date:
        description: Optional end date (YYYY-MM-DD); blank uses the next unpublished week
        required: false
        type: string
      editorial_note:
        description: Optional one-off direction for this draft
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LOCKOUT_API_URL: https://script.google.com/macros/s/AKfycbxwKK71BSc8n4qxxyZVMGrHa7ycBYCG7qddBPeGgbysb_io5PANaP_HVZ2hppewjbiM-A/exec
      PODCAST_START_DATE: ${{ inputs.start_date }}
      PODCAST_END_DATE: ${{ inputs.end_date }}
      PODCAST_EDITORIAL_NOTE: ${{ inputs.editorial_note }}

    steps:
      - name: Check out the live app
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install audio converter
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version

      - name: Generate audio-only draft
        id: podcast
        run: node scripts/podcast/generate-draft.mjs

      - name: Commit the proposed episode to its draft branch
        env:
          BRANCH: ${{ steps.podcast.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add podcasts/episodes.json podcasts/audio podcasts/transcripts
          git commit -m "Generate podcast draft"
          git push --force origin "HEAD:refs/heads/$BRANCH"

      - name: Open or update the approval pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.podcast.outputs.branch }}
          PR_TITLE: ${{ steps.podcast.outputs.title }}
          PR_BODY: ${{ steps.podcast.outputs.pr_body }}
        run: |
          if gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$PR_TITLE" --body-file "$PR_BODY"
          else
            gh pr create --draft --base "$GITHUB_REF_NAME" --head "$BRANCH" --title "$PR_TITLE" --body-file "$PR_BODY"
          fi
          gh pr edit "$BRANCH" --add-assignee "$GITHUB_REPOSITORY_OWNER" || true

      - name: Keep a downloadable workflow copy
        uses: actions/upload-artifact@v6
        with:
          name: lockout-podcast-draft-${{ steps.podcast.outputs.period }}
          path: |
            ${{ steps.podcast.outputs.audio_file }}
            ${{ steps.podcast.outputs.transcript_file }}
          retention-days: 14
