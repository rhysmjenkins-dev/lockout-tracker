name: Generate weekly podcast

on:
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional start date (YYYY-MM-DD); blank uses the next unpublished week
        required: false
        type: string
      end_date:
        description: Optional end date (YYYY-MM-DD); blank uses the next unpublished week
        required: false
        type: string
      editorial_note:
        description: Optional one-off direction for this draft
        required: false
        type: string
      replace_existing:
        description: Replace an episode with the same end date
        required: false
        default: false
        type: boolean
      presenter_handover:
        description: Add the one-off new-presenters introduction
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: lockout-podcast-draft
  cancel-in-progress: false

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LOCKOUT_API_URL: https://script.google.com/macros/s/AKfycbxwKK71BSc8n4qxxyZVMGrHa7ycBYCG7qddBPeGgbysb_io5PANaP_HVZ2hppewjbiM-A/exec
      PODCAST_START_DATE: ${{ inputs.start_date }}
      PODCAST_END_DATE: ${{ inputs.end_date }}
      PODCAST_EDITORIAL_NOTE: ${{ inputs.editorial_note }}
      PODCAST_REPLACE_EXISTING: ${{ inputs.replace_existing }}
      PODCAST_PRESENTER_HANDOVER: ${{ inputs.presenter_handover }}
      PODCAST_VOICE_STYLE: dry-pundit

    steps:
      - name: Check out the live app
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install audio converter
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version

      - name: Generate episode
        id: podcast
        run: node scripts/podcast/generate-draft.mjs

      - name: Publish the completed episode
        if: steps.podcast.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A podcasts/episodes.json podcasts/audio podcasts/transcripts
          git commit -m "Publish weekly podcast"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Keep a downloadable workflow copy
        if: steps.podcast.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: lockout-podcast-${{ steps.podcast.outputs.period }}
          path: |
            ${{ steps.podcast.outputs.audio_file }}
            ${{ steps.podcast.outputs.transcript_file }}
          retention-days: 14
